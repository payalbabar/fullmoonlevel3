name: CI — MidnightPass Eligibility Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Compile Compact contract (requires compactc in PATH)
        run: |
          if command -v compactc &> /dev/null; then
            compactc contracts/eligibility.compact managed/eligibility
          else
            echo "compactc not found in PATH — skipping contract compilation (managed artifacts pre-committed)"
          fi
        continue-on-error: true

      - name: Run test suite
        run: npm test

      - name: Build production bundle
        run: npm run build
